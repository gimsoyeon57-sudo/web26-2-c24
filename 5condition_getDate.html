    <title>JavaScript Basic</title>
    <script>
        let data = new Date();
        let year = data.getFullYear();
        let mouth = data.getMonth();
        let day = data.getData();
        let hours = data.getHour();
        let minuts = data.getMinuts();
        let seconds = data.getSeconds();

        alert(year + '-' + mouth + '-' + day + ' ' + hours + ":" + minuts + ":" + seconds);
    </script>
